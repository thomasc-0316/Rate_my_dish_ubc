[build-system]
requires = ["setuptools>=71.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monolith-backend"
version = "0.1.0"
description = "placeholder package with no runtime code."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Project Hawthorn" }]
license = { text = "MIT" }
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = []

[tool.setuptools]

package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["monolith_backend*"]
